<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu - Tạp Hóa Xanh</title>
    <meta name="description" content="Khôi phục mật khẩu tài khoản Tạp Hóa Xanh">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>

    <div class="forgot-page-bg">
        <!-- SINGLE CARD CONTAINER WITH SEQUENTIAL STEPS -->
        <div class="forgot-card">
            
            <!-- STEP 1: NHẬP SỐ ĐIỆN THOẠI NHẬN OTP -->
            <div id="step-1-view" class="forgot-step-view">
                <div class="forgot-card-header">
                    <a href="login.html" class="back-btn" title="Quay lại trang đăng nhập">
                        <i data-lucide="chevron-left" style="width: 28px; height: 28px;"></i>
                    </a>
                    <h1 class="forgot-title">Quên mật khẩu?</h1>
                </div>

                <form onsubmit="goToStep2(event)" style="margin-top: 1rem;">
                    <div style="margin-bottom: 1.5rem;">
                        <label for="otp-phone" class="form-label-custom">Số điện thoại nhận OTP</label>
                        <input type="text" id="otp-phone" class="input-grey-box" placeholder="09xx xxx xxx" required>
                    </div>

                    <button type="submit" class="btn-green-submit">
                        Nhận OTP
                    </button>
                </form>
            </div>

            <!-- STEP 2: ĐẶT LẠI MẬT KHẨU MỚI -->
            <div id="step-2-view" class="forgot-step-view hidden-step">
                <div class="forgot-card-header">
                    <button type="button" onclick="goToStep1()" class="back-btn" title="Quay lại bước trước">
                        <i data-lucide="chevron-left" style="width: 28px; height: 28px;"></i>
                    </button>
                    <h1 class="forgot-title">Quên mật khẩu?</h1>
                </div>

                <form onsubmit="goToStep3(event)">
                    <div style="margin-bottom: 1.25rem;">
                        <label for="new-password" class="form-label-custom">Mật khẩu mới</label>
                        <input type="password" id="new-password" class="input-grey-box" placeholder="••••••••" required>
                    </div>

                    <div style="margin-bottom: 1.25rem;">
                        <label for="confirm-password" class="form-label-custom">Xác nhận mật khẩu mới</label>
                        <input type="password" id="confirm-password" class="input-grey-box" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn-green-submit">
                        Đổi mật khẩu
                    </button>
                </form>
            </div>

            <!-- STEP 3: THÔNG BÁO ĐỔI MẬT KHẨU THÀNH CÔNG -->
            <div id="step-3-view" class="forgot-step-view hidden-step">
                <div class="forgot-card-header" style="margin-bottom: 0.5rem;">
                    <a href="login.html" class="back-btn" title="Quay lại trang đăng nhập">
                        <i data-lucide="chevron-left" style="width: 28px; height: 28px;"></i>
                    </a>
                </div>

                <div style="text-align: center; margin-top: auto; margin-bottom: auto;">
                    <div class="success-circle-icon">
                        <i data-lucide="check" style="width: 34px; height: 34px; stroke-width: 3px;"></i>
                    </div>

                    <h2 class="success-text">Đổi mật khẩu thành công!</h2>

                    <a href="login.html" class="btn-green-close">
                        Đóng
                    </a>
                </div>
            </div>

        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div id="toast-container" class="toast-container"></div>

    <script src="app.js"></script>
    <script>
        function goToStep1() {
            document.getElementById('step-1-view').classList.remove('hidden-step');
            document.getElementById('step-2-view').classList.add('hidden-step');
            document.getElementById('step-3-view').classList.add('hidden-step');
            refreshIcons();
        }

        function goToStep2(e) {
            e.preventDefault();
            const phone = document.getElementById('otp-phone').value.trim();
            if (!phone) {
                showToast('Vui lòng nhập số điện thoại nhận OTP!', 'danger');
                return;
            }
            showToast(`Mã OTP đã được gửi đến số điện thoại ${phone}!`, 'success');
            setTimeout(() => {
                document.getElementById('step-1-view').classList.add('hidden-step');
                document.getElementById('step-2-view').classList.remove('hidden-step');
                document.getElementById('step-3-view').classList.add('hidden-step');
                refreshIcons();
            }, 600);
        }

        function goToStep3(e) {
            e.preventDefault();
            const pass1 = document.getElementById('new-password').value;
            const pass2 = document.getElementById('confirm-password').value;

            if (!pass1 || !pass2) {
                showToast('Vui lòng nhập đầy đủ mật khẩu mới!', 'danger');
                return;
            }
            if (pass1 !== pass2) {
                showToast('Mật khẩu xác nhận không trùng khớp!', 'danger');
                return;
            }

            showToast('Đang cập nhật mật khẩu...', 'info');
            setTimeout(() => {
                document.getElementById('step-1-view').classList.add('hidden-step');
                document.getElementById('step-2-view').classList.add('hidden-step');
                document.getElementById('step-3-view').classList.remove('hidden-step');
                refreshIcons();
            }, 600);
        }
    </script>
</body>
</html>
